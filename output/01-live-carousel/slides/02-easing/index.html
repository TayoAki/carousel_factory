.playhead {

  left: 0;
  top: -14px;
  width: 0;
  height: 100px;
  will-change: transform;
}
.playhead-cap {
  position: absolute;

  height: 22px;

  top: 74px;
  width: 16px;
  height: 16px;
  background: var(--cream);
  border: 3px solid var(--orange);
  opacity: 0;
}

/* ---------- ball ---------- */
.ball-pos {
  position: absolute;
  left: 0;
  top: 0;
  will-change: transform;
}
.ball-squash {
  position: absolute;
  inset: 0;
  transform-origin: 50% 100%;
}
.ball-stretch {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 36% 30%, #ffe07a 0%, var(--orange) 42%, #e0a100 100%);
  box-shadow: 10px 14px 0 rgba(43, 13, 8, 0.32);
}
.ball-stretch::before {
  /* peach crease */
  content: "";
  position: absolute;
  left: 46%;
  top: 6%;
  width: 22%;
  height: 70%;
  border-left: 4px solid rgba(166, 42, 24, 0.45);
  border-radius: 50%;
}
.ball-stretch::after {
  /* leaf */
  content: "";
  position: absolute;
  left: 52%;
  top: -18%;
  width: 42%;
  height: 26%;
  background: #4f8a3a;
  border-radius: 0 100% 0 100%;
  transform: rotate(-18deg);
}
.ball-pos.ghost .ball-stretch::before,
.ball-pos.ghost .ball-stretch::after {
  display: none;
}
.ball-pos.ghost .ball-stretch {
  background: none;
  border: 3px solid var(--cream);
  box-shadow: none;
}

/* ---------- particles ---------- */
.particle {
  position: absolute;
  left: -9px;
  top: -9px;
  width: 18px;
  height: 18px;
  background: var(--cream);
  opacity: 0;
  will-change: transform, opacity;
}
.particle.alt {
  background: var(--orange);
}

  background: var(--cream);
  color: var(--ink);
}
.pill.line {
  border: 2px solid rgba(255, 244, 226, 0.7);
  color: var(--cream);
}

    <script>
      /* Live Carousel engine: everything is a pure function of time (seek-safe both ways). */
(function () {
  const E = {};
  const TAU = Math.PI * 2;

  E.clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  E.lerp = (a, b, s) => a + (b - a) * s;
  E.prog = (t, t0, t1) => E.clamp((t - t0) / (t1 - t0));
  E.easeInOut = (s) => (s < 0.5 ? 4 * s * s * s : 1 - Math.pow(-2 * s + 2, 3) / 2);
  E.easeOut = (s) => 1 - Math.pow(1 - s, 3);
  E.easeIn = (s) => s * s * s;
  E.easeOutQuint = (s) => 1 - Math.pow(1 - s, 5);
  E.easeOutBack = (s, k = 1.7) => 1 + (k + 1) * Math.pow(s - 1, 3) + k * Math.pow(s - 1, 2);
  E.hash = (n) => {
    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  };

  /* Damped spring impulse: 0 at dt=0, kicks to +1-ish, rings out. */
  E.kick = (dt, freq = 3, damp = 7) =>
    dt < 0 ? 0 : Math.exp(-damp * dt) * Math.sin(TAU * freq * dt);
  /* Damped spring settle: 0 -> 1 with overshoot. */
  E.settle = (dt, freq = 2.2, damp = 6) =>
    dt <= 0 ? 0 : 1 - Math.exp(-damp * dt) * Math.cos(TAU * freq * dt);
  /* Smooth pulse (gaussian) centred at c, width w. */
  E.pulse = (t, c, w) => Math.exp(-Math.pow((t - c) / w, 2));

  /*
   * Ball path: waypoints [{t, x, y, h, ease, contact}] where (x, y) is the ball CENTRE.
   * Segment i -> i+1 is a parabola: x eases (default linear), y = lerp - 4h s(1-s).
   * contact: {q, dir} marks a surface hit at that waypoint (squash amount).
   */
  E.makePath = (pts) => {
    const at = (t) => {
      if (t <= pts[0].t) {
        const p = pts[0];
        return { x: p.x, y: p.y, vx: 0, vy: 0 };
      }
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i];
        const b = pts[i + 1];
        if (t <= b.t) {
          const T = b.t - a.t;
          const s = (t - a.t) / T;
          const h = b.h || 0;
          const ez = b.ease || "linear";
          let sx = s;
          let dsx = 1;
          if (ez === "inOut") {
            sx = E.easeInOut(s);
            dsx = s < 0.5 ? 12 * s * s : 3 * Math.pow(-2 * s + 2, 2);
          } else if (ez === "out") {
            sx = E.easeOut(s);
            dsx = 3 * Math.pow(1 - s, 2);
          } else if (ez === "in") {
            sx = E.easeIn(s);
            dsx = 3 * s * s;
          }
          const x = a.x + (b.x - a.x) * sx;
          const y = a.y + (b.y - a.y) * sx - 4 * h * s * (1 - s);
          const vx = ((b.x - a.x) * dsx) / T;
          const vy = ((b.y - a.y) * dsx - 4 * h * (1 - 2 * s)) / T;
          return { x, y, vx, vy };
        }
      }
      const p = pts[pts.length - 1];
      return { x: p.x, y: p.y, vx: 0, vy: 0 };
    };
    const contacts = pts.filter((p) => p.contact);
    return { at, pts, contacts };
  };

  /*
   * Ball renderer: pos > squash (origin bottom) > stretch (rotate along velocity).
   * Returns the deformation state so callers can reuse it.
   */
  E.ballState = (path, t, r, opts = {}) => {
    const p = path.at(t);
    const speed = Math.hypot(p.vx, p.vy);
    const kStretch = opts.stretch === undefined ? 1 : opts.stretch;
    let st = E.clamp((speed / 5200) * kStretch, 0, 0.42 * kStretch);
    let q = 0;
    for (const c of path.contacts) {
      const dt = t - c.t;
      if (dt > -0.06 && dt < 0.5) {
        const amt = c.contact.q === undefined ? 0.45 : c.contact.q;
        // fast squash over ~2 frames, springy recovery
        const env = dt < 0 ? E.pulse(dt, 0, 0.03) : Math.exp(-dt * 16) * Math.cos(dt * 38);
        q += amt * env;
        st *= E.clamp(Math.abs(dt) / 0.09);
      }
    }
    const ang = Math.atan2(p.vy, p.vx);
    return { x: p.x, y: p.y, vx: p.vx, vy: p.vy, st, q, ang, r };
  };

  E.applyBall = (els, s) => {
    // els: {pos, squash, stretch}
    els.pos.style.transform = `translate(${s.x - s.r}px, ${s.y - s.r}px)`;
    const sq = 1 + s.q;
    els.squash.style.transform = `scale(${sq}, ${1 / sq})`;
    const a = 1 + s.st;
    els.stretch.style.transform = `rotate(${s.ang}rad) scale(${a}, ${1 / a}) rotate(${-s.ang}rad)`;
  };

  E.makeBall = (parent, cls, r) => {
    const pos = document.createElement("div");
    pos.className = "ball-pos " + (cls || "");
    pos.style.width = pos.style.height = 2 * r + "px";
    const squash = document.createElement("div");
    squash.className = "ball-squash";
    const stretch = document.createElement("div");
    stretch.className = "ball-stretch";
    squash.appendChild(stretch);
    pos.appendChild(squash);
    parent.appendChild(pos);
    return { pos, squash, stretch };
  };

  /* Dot grid with shockwave ripples, drawn on a canvas. */
  E.makeGrid = (canvas, opts) => {
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;
    const gap = opts.gap || 40;
    const dots = [];
    for (let y = gap / 2 + 4; y < H; y += gap) {
      for (let x = gap / 2 + 4; x < W; x += gap) dots.push([x, y]);
    }
    return (t, waves, alive) => {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = opts.color;
      for (const [x0, y0] of dots) {
        let dx = 0;
        let dy = 0;
        let grow = 0;
        for (const w of waves) {
          const dt = t - w.t;
          if (dt < 0 || dt > 1.6) continue;
          const ex = x0 - w.x;
          const ey = y0 - w.y;
          const d = Math.hypot(ex, ey) || 1;
          const R = dt * (w.v || 1500);
          const band = Math.exp(-Math.pow((d - R) / 70, 2)) * Math.exp(-dt * 2.2) * (w.a || 1);
          dx += (ex / d) * band * 26;
          dy += (ey / d) * band * 26;
          grow += band;
        }
        // gentle breathing when the scene is alive
        const br = alive ? alive * 0.6 * Math.sin(t * 3.1 + x0 * 0.013 + y0 * 0.009) : 0;
        const rad = 2.4 + grow * 3.2 + br;
        ctx.globalAlpha = E.clamp(0.22 + grow * 0.55, 0, 0.85);
        ctx.beginPath();
        ctx.arc(x0 + dx, y0 + dy, Math.max(0.6, rad), 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    };
  };

  /* Timeline ruler: ticks + frame labels continuing across slides, playhead, keyframe diamonds. */
  E.makeRuler = (root, opts) => {
    const { frameStart, frames, width } = opts;
    const px = width / frames; // px per frame
    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("width", width);
    svg.setAttribute("height", 100);
    svg.setAttribute("viewBox", `0 0 ${width} 100`);
    svg.classList.add("ruler-svg");
    let ticks = "";
    for (let f = 0; f <= frames; f++) {
      const x = f * px;
      const gf = frameStart + f;
      const major = gf % 30 === 0;
      const mid = gf % 10 === 0;
      const h = major ? 30 : mid ? 18 : 9;
      ticks += `<line x1="${x.toFixed(2)}" y1="0" x2="${x.toFixed(2)}" y2="${h}" stroke-width="${major ? 3 : 2}" />`;
    }
    svg.innerHTML = `<g class="ruler-ticks">${ticks}</g>`;
    root.appendChild(svg);
    const labels = document.createElement("div");
    labels.className = "ruler-labels";
    for (let f = 0; f <= frames; f++) {
      const gf = frameStart + f;
      if (gf % 30 !== 0) continue;
      const l = document.createElement("div");
      l.className = "ruler-label";
      l.style.left = f * px + "px";
      const sec = gf / 30;
      l.textContent = String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
      labels.appendChild(l);
    }
    root.appendChild(labels);
    const head = document.createElement("div");
    head.className = "playhead";
    head.innerHTML = '<div class="playhead-cap"></div><div class="playhead-line"></div>';
    root.appendChild(head);
    const keys = (opts.keys || []).map((k) => {
      const d = document.createElement("div");
      d.className = "kf";
      d.style.left = (k / opts.duration) * width + "px";
      root.appendChild(d);
      return { t: k, el: d };
    });
    return (t) => {
      head.style.transform = `translateX(${(t / opts.duration) * width}px)`;
      for (const k of keys) {
        const dt = t - k.t;
        if (dt < 0) {
          k.el.style.opacity = 0;
          k.el.style.transform = "translate(-50%, 0) rotate(45deg) scale(0)";
        } else {
          const s = E.settle(dt, 2.6, 7);
          k.el.style.opacity = 1;
          k.el.style.transform = `translate(-50%, 0) rotate(45deg) scale(${s})`;
        }
      }
    };
  };

  /* Deterministic particle burst (diamonds / dots) from a point with gravity. */
  E.makeBurst = (parent, n, seed, cls) => {
    const parts = [];
    for (let i = 0; i < n; i++) {
      const d = document.createElement("div");
      d.className = "particle " + (cls || "");
      if (E.hash(seed + i * 7.3) > 0.55) d.classList.add("alt");
      parent.appendChild(d);
      const ang = -Math.PI / 2 + (E.hash(seed + i * 3.1) - 0.5) * Math.PI * 1.7;
      const spd = 520 + E.hash(seed + i * 5.7) * 900;
      parts.push({ el: d, ang, spd, rot: (E.hash(seed + i * 9.9) - 0.5) * 900, size: 0.6 + E.hash(seed + i * 1.3) * 0.9 });
    }
    return (t, t0, x, y, life = 1.1) => {
      const dt = t - t0;
      for (const p of parts) {
        if (dt < 0 || dt > life) {
          p.el.style.opacity = 0;
          continue;
        }
        const px = x + Math.cos(p.ang) * p.spd * dt;
        const py = y + Math.sin(p.ang) * p.spd * dt + 0.5 * 2600 * dt * dt;
        const o = 1 - Math.pow(dt / life, 2);
        p.el.style.opacity = o;
        p.el.style.transform = `translate(${px}px, ${py}px) rotate(${45 + p.rot * dt}deg) scale(${p.size * (1 - 0.4 * dt / life)})`;
      }
    };
  };

  /* ---------- layout helpers (build-time only) ---------- */
  E.rel = (el, root) => {
    let x = 0,
      y = 0,
      n = el;
    while (n && n !== root) {
      x += n.offsetLeft;
      y += n.offsetTop;
      n = n.offsetParent;
    }
    return { x, y, w: el.offsetWidth, h: el.offsetHeight };
  };

  E.buildWord = (el) => {
    const word = el.dataset.word;
    el.innerHTML = "";
    return [...word].map((c) => {
      const s = document.createElement("span");
      s.className = "ch";
      s.textContent = c;
      // intentional-layering markers on the word apply to every glyph
      for (const attr of ["data-layout-allow-overlap", "data-layout-allow-occlusion"]) {
        if (el.hasAttribute(attr)) s.setAttribute(attr, "");
      }
      const b = document.createElement("i");
      b.style.cssText = "display:inline-block;width:0;height:0;vertical-align:baseline";
      s.appendChild(b);
      el.appendChild(s);
      return { el: s, c, base: b };
    });
  };

  /* Largest font-size (<= maxF) that fits at wdth >= minW, then tune wdth to fill target exactly. */
  E.fitWord = (el, chars, target, maxF = 400, minW = 52) => {
    const setW = (w) => chars.forEach((c) => c.el.style.setProperty("--w", w));
    let F = maxF;
    for (; F > 120; F -= 4) {
      el.style.fontSize = F + "px";
      setW(minW);
      if (el.scrollWidth <= target) break;
    }
    let lo = minW,
      hi = 150;
    for (let i = 0; i < 22; i++) {
      const mid = (lo + hi) / 2;
      setW(mid);
      if (el.scrollWidth > target) hi = mid;
      else lo = mid;
    }
    setW(lo);
    return { F, w: lo };
  };

  /* Per-glyph geometry: centre x, cap top, baseline (uses canvas ink metrics). */
  E.measureWord = (chars, F, root) => {
    const mc = document.createElement("canvas").getContext("2d");
    mc.font = `900 ${F}px Anybody`;
    return chars.map((c) => {
      const r = E.rel(c.el, root);
      const b = E.rel(c.base, root);
      const asc = mc.measureText(c.c).actualBoundingBoxAscent;
      return { cx: r.x + r.w / 2, top: b.y - asc, base: b.y, w: r.w, left: r.x };
    });
  };

  /* Clock tween driving a render(t) function; registers the paused timeline. */
  E.run = (DUR, render) => {
    const tl = gsap.timeline({ paused: true });
    const clock = { t: 0 };
    tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
    render(0);
    window.__timelines["main"] = tl;
  };

  window.LC = E;
})();

    </script>
    <script>
      (function () {
        const L = window.LC;
        const DUR = 8;
        const R = 44;
        const root = document.getElementById("root");
        const X0 = 150,
          X1 = 930;
        const YA = 838 - R,
          YB = 1062 - R; // ball centres resting on the tracks
        const RUNS = [
          { t: 1.0, dir: 1 },
          { t: 2.5, dir: -1 },
          { t: 4.5, dir: 1 },
        ];
        const RUN_LEN = 1.0;

        function build() {
          const wEl = document.getElementById("w-linear");
          const chars = L.buildWord(wEl);
          const fit = L.fitWord(wEl, chars, 936, 236, 52);
          const m = L.measureWord(chars, fit.F, root);
          const capTop = Math.min(...m.map((g) => g.top));
          const baseY = m[0].base;
          const strike = document.getElementById("strike");
          strike.style.top = (capTop + baseY) / 2 - 15 + "px";

          // ---------- hero ball (lane B) path ----------
          const pts = [
            { t: 0, x: -70, y: 930 },
            { t: 0.34, x: X0, y: YB, h: 60, contact: { q: 0.4 } },
            { t: 0.62, x: X0, y: YB, h: 34, contact: { q: 0.16 } },
            { t: 1.0, x: X0, y: YB },
            { t: 2.0, x: X1, y: YB, ease: "inOut" },
            { t: 2.5, x: X1, y: YB },
            { t: 3.5, x: X0, y: YB, ease: "inOut" },
            { t: 4.5, x: X0, y: YB },
            { t: 5.5, x: X1, y: YB, ease: "inOut" },
            { t: 6.5, x: X1, y: YB, contact: { q: 0.32 } },
            { t: 7.25, x: 1320, y: 760, h: 90 },
          ];
          const pathB = L.makePath(pts);
          // robot ball: linear moves, hard stops
          const ptsA = [
            { t: 0, x: X0, y: YA },
            { t: 1.0, x: X0, y: YA },
            { t: 2.0, x: X1, y: YA },
            { t: 2.5, x: X1, y: YA },
            { t: 3.5, x: X0, y: YA },
            { t: 4.5, x: X0, y: YA },
            { t: 5.5, x: X1, y: YA },
            { t: 6.4, x: X1, y: YA },
            { t: 7.4, x: X0, y: YA },
          ];
          const pathA = L.makePath(ptsA);

          // ---------- spacing charts (ticks + onion rings every 2 frames) ----------
          const laneA = document.getElementById("laneA");
          const laneB = document.getElementById("laneB");
          const marks = [];
          RUNS.forEach((run, r) => {
            for (let k = 0; k <= 15; k++) {
              const s = k / 15;
              const sa = run.dir > 0 ? s : 1 - s;
              const sb = run.dir > 0 ? L.easeInOut(s) : 1 - L.easeInOut(s);
              const tk = run.t + s * RUN_LEN;
              [
                [laneA, "", X0 + (X1 - X0) * sa, 838],
                [laneB, " b", X0 + (X1 - X0) * sb, 1062],
              ].forEach(([lane, cls, x, ty]) => {
                const tick = document.createElement("div");
                tick.className = "tick" + cls;
                tick.style.left = x + "px";
                tick.style.top = ty + 12 + "px";
                lane.appendChild(tick);
                const on = document.createElement("div");
                on.className = "onion" + cls;
                on.style.left = x + "px";
                on.style.top = ty - R + "px";
                lane.appendChild(on);
                marks.push({ tick, on, tk, run: r });
              });
            }
          });
          const runEnd = (r) => (r + 1 < RUNS.length ? RUNS[r + 1].t - 0.05 : 7.2);

          // ---------- balls + shadows ----------
          const balls = document.getElementById("balls");
          const shA = document.createElement("div");
          shA.className = "shadow";
          balls.appendChild(shA);
          const shB = document.createElement("div");
          shB.className = "shadow";
          balls.appendChild(shB);
          const ballA = L.makeBall(balls, "robot", R);
          const ghostsB = [3, 2, 1].map((k) => ({ g: L.makeBall(balls, "ghost", R), k }));
          const ballB = L.makeBall(balls, "", R);

          const grid = L.makeGrid(document.getElementById("grid"), { color: "#fff4e2", gap: 45 });
          const waves = [
            { t: 0.34, x: X0, y: 1062, a: 0.7 },
            { t: 3.6, x: 540, y: (capTop + baseY) / 2, a: 0.55, v: 1800 },
            { t: 6.5, x: X1, y: 1062, a: 0.5 },
          ];
          const ruler = L.makeRuler(document.getElementById("ruler"), {
            frameStart: 180,
            frames: 240,
            width: 1080,
            duration: DUR,
            keys: [1.0, 2.0, 2.5, 3.5, 4.5, 5.5, 6.5],
          });

          const world = document.getElementById("world");
          const glow = document.getElementById("glow");
          const dotA = document.getElementById("dotA");
          const dotB = document.getElementById("dotB");
          const tagA = document.getElementById("tagA");
          const tagB = document.getElementById("tagB");
          const callout = document.getElementById("callout");

          function runProg(t) {
            for (const run of RUNS) if (t >= run.t && t <= run.t + RUN_LEN) return (t - run.t) / RUN_LEN;
            return -1;
          }

          function render(t) {
            // small camera bump on the strike + landing
            let sx = 0,
              sy = 0;
            [
              [0.34, 6],
              [3.62, 9],
              [6.5, 4],
            ].forEach(([t0, amp]) => {
              const dt = t - t0;
              if (dt < 0 || dt > 0.5) return;
              const e = Math.exp(-dt * 10) * amp;
              sx += Math.sin(dt * 58 + t0) * e;
              sy += Math.cos(dt * 47 + t0) * e;
            });
            world.style.transform = `translate(${sx.toFixed(2)}px, ${sy.toFixed(2)}px)`;

            // ---------- word: LINEAR letters move like a robot (stepped, rigid) ----------
            chars.forEach((c, i) => {
              // a stiff, stepped nudge each time the robot ball starts a run
              let y = 0;
              RUNS.forEach((run) => {
                const p = L.prog(t, run.t + i * 0.05, run.t + i * 0.05 + 0.2);
                y += p > 0 && p < 1 ? -10 * Math.round(Math.sin(p * Math.PI) * 3) / 3 : 0;
              });
              // strike hit: letters dip as the marker passes
              const passT = 3.5 + 0.06 + (i / chars.length) * 0.22;
              const k = L.kick(t - passT, 2.6, 7);
              c.el.style.transform = `translateY(${(y + 16 * k).toFixed(2)}px) scale(${(1 + 0.04 * k).toFixed(4)}, ${(1 - 0.07 * k).toFixed(4)})`;
            });

            // ---------- strike-through ----------
            const sIn = L.easeOut(L.prog(t, 3.5, 3.78));
            const sOut = L.easeIn(L.prog(t, 7.3, 7.6));
            strike.style.transformOrigin = t < 7.3 ? "0 50%" : "100% 50%";
            strike.style.transform = `rotate(-2.5deg) scaleX(${(t < 7.3 ? sIn : 1 - sOut).toFixed(4)})`;

            // ---------- spacing marks ----------
            for (const mk of marks) {
              const dt = t - mk.tk;
              const end = runEnd(mk.run);
              if (dt < 0 || t > end + 0.3) {
                mk.tick.style.opacity = 0;
                mk.on.style.opacity = 0;
                continue;
              }
              const fade = 1 - L.prog(t, end, end + 0.3);
              const pop = L.settle(dt, 3, 9);
              mk.tick.style.opacity = fade;
              mk.tick.style.transform = `scaleY(${pop.toFixed(3)})`;
              mk.on.style.opacity = (0.55 * fade).toFixed(3);
              mk.on.style.transform = `scale(${(0.6 + 0.4 * Math.min(1, pop)).toFixed(3)})`;
            }

            // ---------- tags + callout ----------
            const tagIn = (t0) => (t < 7.1 ? L.settle(t - t0, 2.6, 7) : 1 - L.easeIn(L.prog(t, 7.1, 7.35)));
            const ta = tagIn(2.0),
              tb = tagIn(2.08);
            tagA.style.opacity = ta > 0.01 ? 1 : 0;
            tagA.style.transform = `scale(${Math.max(0, ta).toFixed(3)})`;
            tagB.style.opacity = tb > 0.01 ? 1 : 0;
            tagB.style.transform = `scale(${Math.max(0, tb).toFixed(3)}) rotate(${(-4 * Math.min(1, tb)).toFixed(2)}deg)`;
            const cIn = L.prog(t, 2.2, 2.6),
              cOut = L.prog(t, 7.0, 7.4);
            callout.style.opacity = (cIn * (1 - cOut)).toFixed(3);
            callout.style.transform = `translateY(${((1 - L.easeOut(cIn)) * 16).toFixed(1)}px)`;

            // ---------- curve icons ----------
            const rp = runProg(t);
            const s = rp < 0 ? (t < 1.0 ? 0 : 1) : rp;
            dotA.setAttribute("cx", (14 + 68 * s).toFixed(2));
            dotA.setAttribute("cy", (52 - 40 * s).toFixed(2));
            // cubic bezier (14,52) (56,52) (40,12) (82,12): sample by parameter, close to ease-in-out
            const u = s,
              iu = 1 - u;
            const bx = iu * iu * iu * 14 + 3 * iu * iu * u * 56 + 3 * iu * u * u * 40 + u * u * u * 82;
            const by = iu * iu * iu * 52 + 3 * iu * iu * u * 52 + 3 * iu * u * u * 12 + u * u * u * 12;
            dotB.setAttribute("cx", bx.toFixed(2));
            dotB.setAttribute("cy", by.toFixed(2));

            // ---------- balls ----------
            const a = pathA.at(t);
            // robot: hard stop jitter at the end of each move
            let jit = 0;
            [2.0, 3.5, 5.5, 7.4].forEach((te) => {
              const dt = t - te;
              if (dt >= 0 && dt < 0.25) jit += (Math.floor(dt * 30) % 2 ? 1 : -1) * 4 * (1 - dt / 0.25);
            });
            ballA.pos.style.transform = `translate(${(a.x - R + jit).toFixed(2)}px, ${(a.y - R).toFixed(2)}px)`;
            shA.style.transform = `translate(${(a.x + jit).toFixed(2)}px, ${838 - 9}px)`;

            const bs = L.ballState(pathB, t, R, { stretch: 0.3 });
            const visB = t <= 7.25;
            ballB.pos.style.opacity = visB ? 1 : 0;
            L.applyBall(ballB, bs);
            const hB = Math.max(0, YB - bs.y);
            shB.style.opacity = visB ? L.clamp(1 - hB / 260).toFixed(3) : 0;
            shB.style.transform = `translate(${bs.x.toFixed(2)}px, ${1062 - 9}px) scale(${(1 - Math.min(0.6, hB / 400)).toFixed(3)})`;
            ghostsB.forEach(({ g, k }) => {
              const tg = t - k * 0.05;
              const gs = L.ballState(pathB, tg, R, { stretch: 0.3 });
              const speed = Math.hypot(gs.vx, gs.vy);
              g.pos.style.opacity = visB ? (L.clamp(speed / 1600) * (0.7 - k * 0.15)).toFixed(3) : 0;
              L.applyBall(g, gs);
            });

            // glow follows the eased ball
            glow.style.opacity = "0.55";
            glow.style.transform = `translate(${(bs.x - 550).toFixed(1)}px, ${(bs.y - 550).toFixed(1)}px) scale(0.55)`;

            grid(t, waves, 1);
            ruler(t);
          }

          const tl = gsap.timeline({ paused: true });
          const clock = { t: 0 };
          tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
          render(0);
          window.__timelines["main"] = tl;
        }

        document.fonts.load("900 100px Anybody");
        document.fonts.load("500 26px 'JetBrains Mono'");
        document.fonts.load("italic 420 76px Fraunces");
        document.fonts.ready.then(build);
      })();
    </script>
