:root {
  --cobalt: #d93a26;
  --cobalt-hi: #ec5638;
  --cobalt-deep: #a82a18;
  --cream: #fff4e2;
  --orange: #ffc531;
  --ink: #2b0d08;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  width: 1080px;
  height: 1350px;
  overflow: hidden;
  background: var(--cobalt);
}
#root {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  color: var(--cream);
}
.scene {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: radial-gradient(130% 90% at 50% 12%, var(--cobalt-hi) 0%, var(--cobalt) 46%, var(--cobalt-deep) 100%);
}
.world {
  position: absolute;
  inset: 0;
  will-change: transform;
}
.layer {
  position: absolute;
  inset: 0;
}
canvas.grid {
  position: absolute;
  left: 0;
  top: 0;
  width: 1080px;
  height: 1350px;
}
.glow {
  position: absolute;
  width: 1100px;
  height: 1100px;
  left: -10px;
  top: 0;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 197, 49, 0.32) 0%, rgba(255, 197, 49, 0) 62%);
  opacity: 0;
}

/* ---------- top bar ---------- */
.topbar {
  position: absolute;
  left: 72px;
  right: 72px;
  top: 50px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--mono);
  font-weight: 500;
  font-size: 25px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--cream);
}
.topbar .tb-left {
  display: flex;
  align-items: center;
  gap: 16px;
}
.topbar .dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--orange);
  display: block;
}
.hairline {
  position: absolute;
  left: 0;
  width: 1080px;
  top: 118px;
  height: 2px;
  background: var(--cream);
  opacity: 0.38;
  transform-origin: 0 50%;
}

/* ---------- type ---------- */
.small {
  font-family: "Fraunces", Georgia, serif;
  font-style: italic;
  font-weight: 420;
  font-variation-settings: "opsz" 144;
  font-size: 76px;
  line-height: 1;
  letter-spacing: -0.01em;

}
.big {

  font-weight: 900;
  line-height: 0.8;

}

}
.mono {
  font-family: var(--mono);
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

/* ---------- ruler ---------- */
.ruler {
  position: absolute;
  left: 0;
  top: 1196px;
  width: 1080px;
  height: 100px;
}
.ruler-svg {
  position: absolute;
  left: 0;
  top: 0;
  overflow: visible;
}
.ruler-ticks line {
  stroke: var(--cream);
  opacity: 0.62;
}
.ruler-labels {
  position: absolute;
  left: 0;
  top: 40px;
  width: 1080px;
  height: 30px;
}
.ruler-label {
  position: absolute;
  top: 0;
  padding-left: 8px;
  font-family: var(--mono);
  font-size: 24px;
  font-weight: 500;
  letter-spacing: 0.06em;
  color: var(--cream);
  opacity: 0.9;
  white-space: nowrap;
}
.playhead {
  position: absolute;
  left: 0;
  top: -14px;
  width: 0;
  height: 100px;
  will-change: transform;
}
.playhead-cap {
  position: absolute;
  left: -11px;
  top: 0;
  width: 22px;
  height: 22px;
  background: var(--orange);
  border-radius: 4px 4px 11px 11px;
}
.playhead-line {
  position: absolute;
  left: -1.5px;
  top: 18px;
  width: 3px;
  height: 82px;
  background: var(--orange);
}
.kf {
  position: absolute;
  top: 74px;
  width: 16px;
  height: 16px;
  background: var(--cream);
  border: 3px solid var(--orange);
  opacity: 0;
}

/* ---------- ball ---------- */
.ball-pos {
  position: absolute;
  left: 0;
  top: 0;
  will-change: transform;
}
.ball-squash {
  position: absolute;
  inset: 0;
  transform-origin: 50% 100%;
}
.ball-stretch {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 36% 30%, #ffe07a 0%, var(--orange) 42%, #e0a100 100%);
  box-shadow: 10px 14px 0 rgba(43, 13, 8, 0.32);
}
.ball-stretch::before {
  /* peach crease */
  content: "";
  position: absolute;
  left: 46%;
  top: 6%;
  width: 22%;
  height: 70%;
  border-left: 4px solid rgba(166, 42, 24, 0.45);
  border-radius: 50%;
}
.ball-stretch::after {
  /* leaf */
  content: "";
  position: absolute;
  left: 52%;
  top: -18%;
  width: 42%;
  height: 26%;
  background: #4f8a3a;
  border-radius: 0 100% 0 100%;
  transform: rotate(-18deg);
}
.ball-pos.ghost .ball-stretch::before,
.strobe .ball-stretch::before,
.strobe .ball-stretch::after,
.ball-pos.ghost .ball-stretch::after {
  display: none;
}
.ball-pos.ghost .ball-stretch {
  background: none;
  border: 3px solid var(--cream);
  box-shadow: none;
}

/* ---------- particles ---------- */
.particle {
  position: absolute;
  left: -9px;
  top: -9px;
  width: 18px;
  height: 18px;
  background: var(--cream);
  opacity: 0;
  will-change: transform, opacity;
}
.particle.alt {
  background: var(--orange);
}

.pill {

  align-items: center;
  gap: 12px;

  border-radius: 26px;
  font-family: var(--mono);
  font-size: 25px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.pill.solid {
  background: var(--cream);
  color: var(--ink);
}
.pill.line {
  border: 2px solid rgba(255, 244, 226, 0.7);
  color: var(--cream);
}

    <script>
      /* Live Carousel engine: everything is a pure function of time (seek-safe both ways). */
(function () {
  const E = {};
  const TAU = Math.PI * 2;

  E.clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  E.lerp = (a, b, s) => a + (b - a) * s;
  E.prog = (t, t0, t1) => E.clamp((t - t0) / (t1 - t0));
  E.easeInOut = (s) => (s < 0.5 ? 4 * s * s * s : 1 - Math.pow(-2 * s + 2, 3) / 2);
  E.easeOut = (s) => 1 - Math.pow(1 - s, 3);
  E.easeIn = (s) => s * s * s;
  E.easeOutQuint = (s) => 1 - Math.pow(1 - s, 5);
  E.easeOutBack = (s, k = 1.7) => 1 + (k + 1) * Math.pow(s - 1, 3) + k * Math.pow(s - 1, 2);
  E.hash = (n) => {
    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  };

  /* Damped spring impulse: 0 at dt=0, kicks to +1-ish, rings out. */
  E.kick = (dt, freq = 3, damp = 7) =>
    dt < 0 ? 0 : Math.exp(-damp * dt) * Math.sin(TAU * freq * dt);
  /* Damped spring settle: 0 -> 1 with overshoot. */
  E.settle = (dt, freq = 2.2, damp = 6) =>
    dt <= 0 ? 0 : 1 - Math.exp(-damp * dt) * Math.cos(TAU * freq * dt);
  /* Smooth pulse (gaussian) centred at c, width w. */
  E.pulse = (t, c, w) => Math.exp(-Math.pow((t - c) / w, 2));

  /*
   * Ball path: waypoints [{t, x, y, h, ease, contact}] where (x, y) is the ball CENTRE.
   * Segment i -> i+1 is a parabola: x eases (default linear), y = lerp - 4h s(1-s).
   * contact: {q, dir} marks a surface hit at that waypoint (squash amount).
   */
  E.makePath = (pts) => {
    const at = (t) => {
      if (t <= pts[0].t) {
        const p = pts[0];
        return { x: p.x, y: p.y, vx: 0, vy: 0 };
      }
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i];
        const b = pts[i + 1];
        if (t <= b.t) {
          const T = b.t - a.t;
          const s = (t - a.t) / T;
          const h = b.h || 0;
          const ez = b.ease || "linear";
          let sx = s;
          let dsx = 1;
          if (ez === "inOut") {
            sx = E.easeInOut(s);
            dsx = s < 0.5 ? 12 * s * s : 3 * Math.pow(-2 * s + 2, 2);
          } else if (ez === "out") {
            sx = E.easeOut(s);
            dsx = 3 * Math.pow(1 - s, 2);
          } else if (ez === "in") {
            sx = E.easeIn(s);
            dsx = 3 * s * s;
          }
          const x = a.x + (b.x - a.x) * sx;
          const y = a.y + (b.y - a.y) * sx - 4 * h * s * (1 - s);
          const vx = ((b.x - a.x) * dsx) / T;
          const vy = ((b.y - a.y) * dsx - 4 * h * (1 - 2 * s)) / T;
          return { x, y, vx, vy };
        }
      }
      const p = pts[pts.length - 1];
      return { x: p.x, y: p.y, vx: 0, vy: 0 };
    };
    const contacts = pts.filter((p) => p.contact);
    return { at, pts, contacts };
  };

  /*
   * Ball renderer: pos > squash (origin bottom) > stretch (rotate along velocity).
   * Returns the deformation state so callers can reuse it.
   */
  E.ballState = (path, t, r, opts = {}) => {
    const p = path.at(t);
    const speed = Math.hypot(p.vx, p.vy);
    const kStretch = opts.stretch === undefined ? 1 : opts.stretch;
    let st = E.clamp((speed / 5200) * kStretch, 0, 0.42 * kStretch);
    let q = 0;
    for (const c of path.contacts) {
      const dt = t - c.t;
      if (dt > -0.06 && dt < 0.5) {
        const amt = c.contact.q === undefined ? 0.45 : c.contact.q;
        // fast squash over ~2 frames, springy recovery
        const env = dt < 0 ? E.pulse(dt, 0, 0.03) : Math.exp(-dt * 16) * Math.cos(dt * 38);
        q += amt * env;
        st *= E.clamp(Math.abs(dt) / 0.09);
      }
    }
    const ang = Math.atan2(p.vy, p.vx);
    return { x: p.x, y: p.y, vx: p.vx, vy: p.vy, st, q, ang, r };
  };

  E.applyBall = (els, s) => {
    // els: {pos, squash, stretch}
    els.pos.style.transform = `translate(${s.x - s.r}px, ${s.y - s.r}px)`;
    const sq = 1 + s.q;
    els.squash.style.transform = `scale(${sq}, ${1 / sq})`;
    const a = 1 + s.st;
    els.stretch.style.transform = `rotate(${s.ang}rad) scale(${a}, ${1 / a}) rotate(${-s.ang}rad)`;
  };

  E.makeBall = (parent, cls, r) => {
    const pos = document.createElement("div");
    pos.className = "ball-pos " + (cls || "");
    pos.style.width = pos.style.height = 2 * r + "px";
    const squash = document.createElement("div");
    squash.className = "ball-squash";
    const stretch = document.createElement("div");
    stretch.className = "ball-stretch";
    squash.appendChild(stretch);
    pos.appendChild(squash);
    parent.appendChild(pos);
    return { pos, squash, stretch };
  };

  /* Dot grid with shockwave ripples, drawn on a canvas. */
  E.makeGrid = (canvas, opts) => {
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;
    const gap = opts.gap || 40;
    const dots = [];
    for (let y = gap / 2 + 4; y < H; y += gap) {
      for (let x = gap / 2 + 4; x < W; x += gap) dots.push([x, y]);
    }
    return (t, waves, alive) => {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = opts.color;
      for (const [x0, y0] of dots) {
        let dx = 0;
        let dy = 0;
        let grow = 0;
        for (const w of waves) {
          const dt = t - w.t;
          if (dt < 0 || dt > 1.6) continue;
          const ex = x0 - w.x;
          const ey = y0 - w.y;
          const d = Math.hypot(ex, ey) || 1;
          const R = dt * (w.v || 1500);
          const band = Math.exp(-Math.pow((d - R) / 70, 2)) * Math.exp(-dt * 2.2) * (w.a || 1);
          dx += (ex / d) * band * 26;
          dy += (ey / d) * band * 26;
          grow += band;
        }
        // gentle breathing when the scene is alive
        const br = alive ? alive * 0.6 * Math.sin(t * 3.1 + x0 * 0.013 + y0 * 0.009) : 0;
        const rad = 2.4 + grow * 3.2 + br;
        ctx.globalAlpha = E.clamp(0.22 + grow * 0.55, 0, 0.85);
        ctx.beginPath();
        ctx.arc(x0 + dx, y0 + dy, Math.max(0.6, rad), 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    };
  };

  /* Timeline ruler: ticks + frame labels continuing across slides, playhead, keyframe diamonds. */
  E.makeRuler = (root, opts) => {
    const { frameStart, frames, width } = opts;
    const px = width / frames; // px per frame
    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("width", width);
    svg.setAttribute("height", 100);
    svg.setAttribute("viewBox", `0 0 ${width} 100`);
    svg.classList.add("ruler-svg");
    let ticks = "";
    for (let f = 0; f <= frames; f++) {
      const x = f * px;
      const gf = frameStart + f;
      const major = gf % 30 === 0;
      const mid = gf % 10 === 0;
      const h = major ? 30 : mid ? 18 : 9;

            const nud = t > 5.25 ? Math.max(0, Math.sin((t - 5.25) * Math.PI * 2 * 1.6)) * Math.exp(-(t - 5.25) * 1.5) : 0;
            const nudBeat = t > 2.5 && t < 4.5 ? Math.max(0, Math.sin(Math.PI * 2 * ph)) * 0.5 : 0;
            swipe.style.transform = `translateX(${((nud + nudBeat) * 14).toFixed(2)}px)`;
          }

          const tl = gsap.timeline({ paused: true });
          const clock = { t: 0 };
          tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
          render(0);
          window.__timelines["main"] = tl;
        }

        document.fonts.load("900 100px Anybody");
        document.fonts.load("500 26px 'JetBrains Mono'");
        document.fonts.load("italic 420 76px Fraunces");
        document.fonts.ready.then(build);
      })();
    </script>
  </body>
</html>
