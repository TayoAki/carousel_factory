/* ---------- ball ---------- */
.ball-pos {
  position: absolute;
  left: 0;
  top: 0;
  will-change: transform;
}
.ball-squash {
  position: absolute;
  inset: 0;
  transform-origin: 50% 100%;
}
.ball-stretch {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 36% 30%, #ffe07a 0%, var(--orange) 42%, #e0a100 100%);
  box-shadow: 10px 14px 0 rgba(43, 13, 8, 0.32);
}
.ball-stretch::before {
  /* peach crease */
  content: "";
  position: absolute;
  left: 46%;
  top: 6%;
  width: 22%;
  height: 70%;
  border-left: 4px solid rgba(166, 42, 24, 0.45);
  border-radius: 50%;
}
.ball-stretch::after {
  /* leaf */
  content: "";
  position: absolute;
  left: 52%;
  top: -18%;
  width: 42%;
  height: 26%;
  background: #4f8a3a;
  border-radius: 0 100% 0 100%;
  transform: rotate(-18deg);
}
.ball-pos.ghost .ball-stretch::before,
.strobe .ball-stretch::before,
.strobe .ball-stretch::after,
.ball-pos.ghost .ball-stretch::after {
  display: none;
}
.ball-pos.ghost .ball-stretch {
  background: none;
  border: 3px solid var(--cream);
  box-shadow: none;
}

/* ---------- particles ---------- */
.particle {
  position: absolute;
  left: -9px;
  top: -9px;
  width: 18px;
  height: 18px;
  background: var(--cream);
  opacity: 0;
  will-change: transform, opacity;
}
.particle.alt {
  background: var(--orange);
}

.pill.solid {
  background: var(--cream);
  color: var(--ink);
}
.pill.line {
  border: 2px solid rgba(255, 244, 226, 0.7);
  color: var(--cream);
}

    <script>
      /* Live Carousel engine: everything is a pure function of time (seek-safe both ways). */
(function () {
  const E = {};
  const TAU = Math.PI * 2;

  E.clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  E.lerp = (a, b, s) => a + (b - a) * s;
  E.prog = (t, t0, t1) => E.clamp((t - t0) / (t1 - t0));
  E.easeInOut = (s) => (s < 0.5 ? 4 * s * s * s : 1 - Math.pow(-2 * s + 2, 3) / 2);
  E.easeOut = (s) => 1 - Math.pow(1 - s, 3);
  E.easeIn = (s) => s * s * s;
  E.easeOutQuint = (s) => 1 - Math.pow(1 - s, 5);
  E.easeOutBack = (s, k = 1.7) => 1 + (k + 1) * Math.pow(s - 1, 3) + k * Math.pow(s - 1, 2);
  E.hash = (n) => {
    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  };

  /* Damped spring impulse: 0 at dt=0, kicks to +1-ish, rings out. */
  E.kick = (dt, freq = 3, damp = 7) =>
    dt < 0 ? 0 : Math.exp(-damp * dt) * Math.sin(TAU * freq * dt);
  /* Damped spring settle: 0 -> 1 with overshoot. */
  E.settle = (dt, freq = 2.2, damp = 6) =>
    dt <= 0 ? 0 : 1 - Math.exp(-damp * dt) * Math.cos(TAU * freq * dt);
  /* Smooth pulse (gaussian) centred at c, width w. */
  E.pulse = (t, c, w) => Math.exp(-Math.pow((t - c) / w, 2));

  /*
   * Ball path: waypoints [{t, x, y, h, ease, contact}] where (x, y) is the ball CENTRE.
   * Segment i -> i+1 is a parabola: x eases (default linear), y = lerp - 4h s(1-s).
   * contact: {q, dir} marks a surface hit at that waypoint (squash amount).
   */
  E.makePath = (pts) => {
    const at = (t) => {
      if (t <= pts[0].t) {
        const p = pts[0];
        return { x: p.x, y: p.y, vx: 0, vy: 0 };
      }
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i];
        const b = pts[i + 1];
        if (t <= b.t) {
          const T = b.t - a.t;
          const s = (t - a.t) / T;
          const h = b.h || 0;
          const ez = b.ease || "linear";
          let sx = s;
          let dsx = 1;
          if (ez === "inOut") {
            sx = E.easeInOut(s);
            dsx = s < 0.5 ? 12 * s * s : 3 * Math.pow(-2 * s + 2, 2);
          } else if (ez === "out") {
            sx = E.easeOut(s);
            dsx = 3 * Math.pow(1 - s, 2);
          } else if (ez === "in") {
            sx = E.easeIn(s);
            dsx = 3 * s * s;
          }
          const x = a.x + (b.x - a.x) * sx;
          const y = a.y + (b.y - a.y) * sx - 4 * h * s * (1 - s);
          const vx = ((b.x - a.x) * dsx) / T;
          const vy = ((b.y - a.y) * dsx - 4 * h * (1 - 2 * s)) / T;
          return { x, y, vx, vy };
        }
      }
      const p = pts[pts.length - 1];
      return { x: p.x, y: p.y, vx: 0, vy: 0 };
    };
    const contacts = pts.filter((p) => p.contact);
    return { at, pts, contacts };
  };

  /*
   * Ball renderer: pos > squash (origin bottom) > stretch (rotate along velocity).
   * Returns the deformation state so callers can reuse it.
   */
  E.ballState = (path, t, r, opts = {}) => {
    const p = path.at(t);
    const speed = Math.hypot(p.vx, p.vy);
    const kStretch = opts.stretch === undefined ? 1 : opts.stretch;
    let st = E.clamp((speed / 5200) * kStretch, 0, 0.42 * kStretch);
    let q = 0;
    for (const c of path.contacts) {
      const dt = t - c.t;
      if (dt > -0.06 && dt < 0.5) {
        const amt = c.contact.q === undefined ? 0.45 : c.contact.q;
        // fast squash over ~2 frames, springy recovery
        const env = dt < 0 ? E.pulse(dt, 0, 0.03) : Math.exp(-dt * 16) * Math.cos(dt * 38);
        q += amt * env;
        st *= E.clamp(Math.abs(dt) / 0.09);
      }
    }
    const ang = Math.atan2(p.vy, p.vx);
    return { x: p.x, y: p.y, vx: p.vx, vy: p.vy, st, q, ang, r };
  };

  E.applyBall = (els, s) => {
    // els: {pos, squash, stretch}
    els.pos.style.transform = `translate(${s.x - s.r}px, ${s.y - s.r}px)`;
    const sq = 1 + s.q;
    els.squash.style.transform = `scale(${sq}, ${1 / sq})`;
    const a = 1 + s.st;
    els.stretch.style.transform = `rotate(${s.ang}rad) scale(${a}, ${1 / a}) rotate(${-s.ang}rad)`;
  };

  E.makeBall = (parent, cls, r) => {
    const pos = document.createElement("div");
    pos.className = "ball-pos " + (cls || "");
    pos.style.width = pos.style.height = 2 * r + "px";
    const squash = document.createElement("div");
    squash.className = "ball-squash";
    const stretch = document.createElement("div");
    stretch.className = "ball-stretch";
    squash.appendChild(stretch);
    pos.appendChild(squash);
    parent.appendChild(pos);
    return { pos, squash, stretch };
  };

  /* Dot grid with shockwave ripples, drawn on a canvas. */
  E.makeGrid = (canvas, opts) => {
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;
    const gap = opts.gap || 40;
    const dots = [];
    for (let y = gap / 2 + 4; y < H; y += gap) {
      for (let x = gap / 2 + 4; x < W; x += gap) dots.push([x, y]);
    }
    return (t, waves, alive) => {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = opts.color;
      for (const [x0, y0] of dots) {
        let dx = 0;
        let dy = 0;
        let grow = 0;
        for (const w of waves) {
          const dt = t - w.t;
          if (dt < 0 || dt > 1.6) continue;
          const ex = x0 - w.x;
          const ey = y0 - w.y;
          const d = Math.hypot(ex, ey) || 1;
          const R = dt * (w.v || 1500);
          const band = Math.exp(-Math.pow((d - R) / 70, 2)) * Math.exp(-dt * 2.2) * (w.a || 1);
          dx += (ex / d) * band * 26;
          dy += (ey / d) * band * 26;
          grow += band;
        }
        // gentle breathing when the scene is alive
        const br = alive ? alive * 0.6 * Math.sin(t * 3.1 + x0 * 0.013 + y0 * 0.009) : 0;
        const rad = 2.4 + grow * 3.2 + br;
        ctx.globalAlpha = E.clamp(0.22 + grow * 0.55, 0, 0.85);
        ctx.beginPath();
        ctx.arc(x0 + dx, y0 + dy, Math.max(0.6, rad), 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    };
  };

  /* Timeline ruler: ticks + frame labels continuing across slides, playhead, keyframe diamonds. */
  E.makeRuler = (root, opts) => {
    const { frameStart, frames, width } = opts;
    const px = width / frames; // px per frame
    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("width", width);
    svg.setAttribute("height", 100);
    svg.setAttribute("viewBox", `0 0 ${width} 100`);
    svg.classList.add("ruler-svg");
    let ticks = "";
    for (let f = 0; f <= frames; f++) {
      const x = f * px;
      const gf = frameStart + f;
      const major = gf % 30 === 0;
      const mid = gf % 10 === 0;
      const h = major ? 30 : mid ? 18 : 9;
      ticks += `<line x1="${x.toFixed(2)}" y1="0" x2="${x.toFixed(2)}" y2="${h}" stroke-width="${major ? 3 : 2}" />`;
    }
    svg.innerHTML = `<g class="ruler-ticks">${ticks}</g>`;
    root.appendChild(svg);
    const labels = document.createElement("div");
    labels.className = "ruler-labels";
    for (let f = 0; f <= frames; f++) {
      const gf = frameStart + f;
      if (gf % 30 !== 0) continue;
      const l = document.createElement("div");
      l.className = "ruler-label";
      l.style.left = f * px + "px";
      const sec = gf / 30;
      l.textContent = String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
      labels.appendChild(l);
    }
    root.appendChild(labels);
    const head = document.createElement("div");
    head.className = "playhead";
    head.innerHTML = '<div class="playhead-cap"></div><div class="playhead-line"></div>';
    root.appendChild(head);
    const keys = (opts.keys || []).map((k) => {
      const d = document.createElement("div");
      d.className = "kf";
      d.style.left = (k / opts.duration) * width + "px";
      root.appendChild(d);
      return { t: k, el: d };
    });
    return (t) => {
      head.style.transform = `translateX(${(t / opts.duration) * width}px)`;
      for (const k of keys) {
        const dt = t - k.t;
        if (dt < 0) {
          k.el.style.opacity = 0;
          k.el.style.transform = "translate(-50%, 0) rotate(45deg) scale(0)";
        } else {
          const s = E.settle(dt, 2.6, 7);
          k.el.style.opacity = 1;
          k.el.style.transform = `translate(-50%, 0) rotate(45deg) scale(${s})`;
        }
      }
    };
  };

  /* Deterministic particle burst (diamonds / dots) from a point with gravity. */
  E.makeBurst = (parent, n, seed, cls) => {
    const parts = [];
    for (let i = 0; i < n; i++) {
      const d = document.createElement("div");
      d.className = "particle " + (cls || "");
      if (E.hash(seed + i * 7.3) > 0.55) d.classList.add("alt");
      parent.appendChild(d);
      const ang = -Math.PI / 2 + (E.hash(seed + i * 3.1) - 0.5) * Math.PI * 1.7;
      const spd = 520 + E.hash(seed + i * 5.7) * 900;
      parts.push({ el: d, ang, spd, rot: (E.hash(seed + i * 9.9) - 0.5) * 900, size: 0.6 + E.hash(seed + i * 1.3) * 0.9 });
    }
    return (t, t0, x, y, life = 1.1) => {
      const dt = t - t0;
      for (const p of parts) {
        if (dt < 0 || dt > life) {
          p.el.style.opacity = 0;
          continue;
        }
        const px = x + Math.cos(p.ang) * p.spd * dt;
        const py = y + Math.sin(p.ang) * p.spd * dt + 0.5 * 2600 * dt * dt;
        const o = 1 - Math.pow(dt / life, 2);
        p.el.style.opacity = o;
        p.el.style.transform = `translate(${px}px, ${py}px) rotate(${45 + p.rot * dt}deg) scale(${p.size * (1 - 0.4 * dt / life)})`;
      }
    };
  };

  /* ---------- layout helpers (build-time only) ---------- */
  E.rel = (el, root) => {
    let x = 0,
      y = 0,
      n = el;
    while (n && n !== root) {
      x += n.offsetLeft;
      y += n.offsetTop;
      n = n.offsetParent;
    }
    return { x, y, w: el.offsetWidth, h: el.offsetHeight };
  };

  E.buildWord = (el) => {
    const word = el.dataset.word;
    el.innerHTML = "";
    return [...word].map((c) => {
      const s = document.createElement("span");
      s.className = "ch";
      s.textContent = c;
      // intentional-layering markers on the word apply to every glyph
      for (const attr of ["data-layout-allow-overlap", "data-layout-allow-occlusion"]) {
        if (el.hasAttribute(attr)) s.setAttribute(attr, "");
      }
      const b = document.createElement("i");
      b.style.cssText = "display:inline-block;width:0;height:0;vertical-align:baseline";
      s.appendChild(b);
      el.appendChild(s);
      return { el: s, c, base: b };
    });
  };

  /* Largest font-size (<= maxF) that fits at wdth >= minW, then tune wdth to fill target exactly. */
  E.fitWord = (el, chars, target, maxF = 400, minW = 52) => {
    const setW = (w) => chars.forEach((c) => c.el.style.setProperty("--w", w));
    let F = maxF;
    for (; F > 120; F -= 4) {
      el.style.fontSize = F + "px";
      setW(minW);
      if (el.scrollWidth <= target) break;
    }
    let lo = minW,
      hi = 150;
    for (let i = 0; i < 22; i++) {
      const mid = (lo + hi) / 2;
      setW(mid);
      if (el.scrollWidth > target) hi = mid;
      else lo = mid;
    }
    setW(lo);
    return { F, w: lo };
  };

  /* Per-glyph geometry: centre x, cap top, baseline (uses canvas ink metrics). */
  E.measureWord = (chars, F, root) => {
    const mc = document.createElement("canvas").getContext("2d");
    mc.font = `900 ${F}px Anybody`;
    return chars.map((c) => {
      const r = E.rel(c.el, root);
      const b = E.rel(c.base, root);
      const asc = mc.measureText(c.c).actualBoundingBoxAscent;
      return { cx: r.x + r.w / 2, top: b.y - asc, base: b.y, w: r.w, left: r.x };
    });
  };

  /* Clock tween driving a render(t) function; registers the paused timeline. */
  E.run = (DUR, render) => {
    const tl = gsap.timeline({ paused: true });
    const clock = { t: 0 };
    tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
    render(0);
    window.__timelines["main"] = tl;
  };

  window.LC = E;
})();

    </script>
    <script>
      (function () {
        const L = window.LC;
        const DUR = 8;
        const R = 44;
        const root = document.getElementById("root");

        function build() {
          const wEl = document.getElementById("w-weight");
          const chars = L.buildWord(wEl);
          const fit = L.fitWord(wEl, chars, 936, 330, 52);
          const w0 = fit.w;
          const m = L.measureWord(chars, fit.F, root);
          const baseY = m[0].base;

          // ---------- ball path: arc in, decaying bounces across the word ----------
          const cy = (g) => g.top - R;
          const LAND = [
            { t: 1.0, i: 1, h: 0, q: 0.62, A: 0.15 },
            { t: 2.0, i: 3, h: 380, q: 0.55, A: 0.12 },
            { t: 2.5, i: 4, h: 165, q: 0.42, A: 0.08 },
            { t: 2.75, i: 5, h: 64, q: 0.28, A: 0.045 },
            { t: 2.875, i: 5, h: 20, q: 0.14, A: 0.02 },
          ];
          const pts = [{ t: 0, x: -70, y: 800 }];
          LAND.forEach((l, n) => {
            pts.push({ t: l.t, x: m[l.i].cx, y: cy(m[l.i]), h: n === 0 ? 430 : l.h, contact: { q: l.q } });
          });
          const restX = m[5].cx,
            restY = cy(m[5]);
          const ANT = 0.17; // word anticipation squash before the launch
          const antDrop = (baseY - m[5].top) * ANT;
          pts.push({ t: 2.96, x: restX, y: restY, h: 6 });
          pts.push({ t: 6.0, x: restX, y: restY });
          pts.push({ t: 6.45, x: restX, y: restY + antDrop, ease: "inOut", contact: { q: 0.4 } });
          pts.push({ t: 7.2, x: 1290, y: 120, h: 260 });
          const path = L.makePath(pts);

          // ---------- strobe ghosts (chronophotograph), every 2 frames ----------
          const strobes = document.getElementById("strobes");
          const ghosts = [];
          const strobeTimes = [];
          for (let k = 0; ; k++) {
            const tk = 0.2 + k * 0.1;
            if (tk > 1.95) break;
            strobeTimes.push(tk);
          }
          strobeTimes.push(2.0, 2.5, 2.75);
          for (const tk of strobeTimes) {
            const s = L.ballState(path, tk, R, { stretch: 1.25 });
            const g = document.createElement("div");
            g.className = "strobe";
            g.innerHTML = '<div class="ball-squash"><div class="ball-stretch"></div></div>';
            strobes.appendChild(g);
            g.style.transform = `translate(${s.x - R}px, ${s.y - R}px)`;
            const sq = 1 + s.q;
            g.firstChild.style.transform = `scale(${sq}, ${1 / sq})`;
            const a = 1 + s.st;
            g.firstChild.firstChild.style.transform = `rotate(${s.ang}rad) scale(${a}, ${1 / a}) rotate(${-s.ang}rad)`;
            ghosts.push({ el: g, t: tk, s });
          }
          // the most stretched ghost in the first fall, and the first-contact squash
          const fall = ghosts.filter((g) => g.t > 0.6 && g.t < 0.98);
          const gS = fall.reduce((a, b) => (b.s.st > a.s.st ? b : a));
          const gQ = ghosts.reduce((a, b) => (Math.abs(b.t - 1.0) < Math.abs(a.t - 1.0) ? b : a));
          gS.el.classList.add("hot");
          gQ.el.classList.add("hot");

          // ---------- callouts with drawn leaders ----------
          const svg = document.getElementById("leaders");
          const NS = "http://www.w3.org/2000/svg";
          const noteS = document.getElementById("noteS");
          const noteQ = document.getElementById("noteQ");
          // STRETCH note sits to the right of the falling ghost, QUASH note to the left of the contact
          const sNote = { x: 700, y: 300 };
          const qNote = { x: 72, y: gQ.s.y - 250 };
          noteS.style.left = sNote.x + "px";
          noteS.style.top = sNote.y + "px";
          noteQ.style.left = qNote.x + "px";
          noteQ.style.top = qNote.y + "px";
          const mkLeader = (x0, y0, x1, y1) => {
            const p = document.createElementNS(NS, "path");
            const mx = x0,
              my = y1;
            p.setAttribute("d", `M ${x0} ${y0} Q ${mx} ${my} ${x1} ${y1}`);
            svg.appendChild(p);
            const len = p.getTotalLength();
            p.style.strokeDasharray = len;
            p.style.strokeDashoffset = len;
            const c = document.createElementNS(NS, "circle");
            c.setAttribute("cx", x1);
            c.setAttribute("cy", y1);
            c.setAttribute("r", 7);
            c.style.opacity = 0;
            svg.appendChild(c);
            return { p, c, len };
          };
          const leadS = mkLeader(sNote.x + 4, sNote.y + 112, gS.s.x + 34, gS.s.y);
          const leadQ = mkLeader(qNote.x + 60, qNote.y + 112, gQ.s.x - 50, gQ.s.y + 20);

          // ---------- elements ----------
          const balls = document.getElementById("balls");
          const trail = [3, 2, 1].map((k) => ({ g: L.makeBall(balls, "ghost", R), k }));
          const ball = L.makeBall(balls, "", R);
          const grid = L.makeGrid(document.getElementById("grid"), { color: "#fff4e2", gap: 45 });
          const waves = LAND.map((l) => ({ t: l.t, x: m[l.i].cx, y: m[l.i].top, a: l.A * 7, v: 1400 }));
          waves.push({ t: 6.45, x: restX, y: m[5].top, a: 1.1, v: 1700 });
          const burst = L.makeBurst(document.getElementById("fx"), 16, 33);
          const ruler = L.makeRuler(document.getElementById("ruler"), {
            frameStart: 420,
            frames: 240,
            width: 1080,
            duration: DUR,
            keys: [1.0, 2.0, 2.5, 2.75, 2.875, 6.45],
          });
          const world = document.getElementById("world");
          const glow = document.getElementById("glow");
          const word = wEl;

          function render(t) {
            // camera bump on hard landings + launch
            let sx = 0,
              sy = 0;
            [...LAND.slice(0, 3).map((l) => [l.t, l.A * 90]), [6.45, 10]].forEach(([t0, amp]) => {
              const dt = t - t0;
              if (dt < 0 || dt > 0.5) return;
              const e = Math.exp(-dt * 10) * amp;
              sx += Math.sin(dt * 57 + t0) * e * 0.5;
              sy += Math.cos(dt * 49 + t0) * e;
            });
            world.style.transform = `translate(${sx.toFixed(2)}px, ${sy.toFixed(2)}px)`;

            // ---------- the word has weight too ----------
            let squash = 0,
              widen = 0;
            LAND.forEach((l) => {
              const k = L.kick(t - l.t, 2.3, 6);
              squash += l.A * k;
              widen += l.A * 110 * Math.max(0, k);
            });
            // anticipation (crouch) then trampoline release with overshoot
            const crouch = L.easeInOut(L.prog(t, 6.0, 6.45));
            const release = t > 6.45 ? -0.9 * L.kick(t - 6.45, 2.0, 5.5) : 0;
            squash += t < 6.45 ? ANT * crouch : ANT * Math.exp(-(t - 6.45) * 30) + 0.12 * release;
            word.style.transform = `scale(${(1 + squash * 0.3).toFixed(4)}, ${(1 - squash).toFixed(4)})`;
            chars.forEach((c, i) => {
              let dip = 0;
              LAND.forEach((l) => {
                if (l.i === i) dip += l.A * 160 * L.kick(t - l.t, 2.8, 7);
              });
              c.el.style.setProperty("--w", (w0 + widen * (0.6 + 0.4 * Math.cos(i))).toFixed(2));
              c.el.style.transform = `translateY(${dip.toFixed(2)}px)`;
            });

            // ---------- strobe ghosts: appear as the ball passes, fade before the launch ----------
            const out = L.prog(t, 6.05, 6.4);
            for (const g of ghosts) {
              const dt = t - g.t;
              if (dt < 0 || out >= 1) {
                g.el.style.opacity = 0;
                continue;
              }
              const hot = g === gS || g === gQ;
              const base = hot ? 1 : 0.5;
              g.el.style.opacity = (base * L.clamp(dt / 0.12) * (1 - out)).toFixed(3);
            }

            // ---------- notes + leaders ----------
            const noteAnim = (note, lead, t0) => {
              const draw = L.easeInOut(L.prog(t, t0, t0 + 0.35));
              const vanish = L.prog(t, 6.0, 6.3);
              lead.p.style.strokeDashoffset = (lead.len * (1 - draw)).toFixed(2);
              lead.p.style.opacity = 1 - vanish;
              lead.c.style.opacity = draw > 0.98 ? 1 - vanish : 0;
              const pop = L.settle(t - (t0 + 0.12), 2.6, 7);
              note.style.opacity = t < t0 + 0.12 ? 0 : (1 - vanish).toFixed(3);
              note.style.transform = `translateY(${((1 - pop) * 24).toFixed(2)}px) scale(${(0.9 + 0.1 * pop).toFixed(4)})`;
            };
            noteAnim(noteS, leadS, 3.1);
            noteAnim(noteQ, leadQ, 3.6);

            // ---------- ball + trail ----------
            const bs = L.ballState(path, t, R, { stretch: 1.25 });
            // tiny idle breath while resting (it is still alive)
            if (t > 3.1 && t < 6.0) bs.q += 0.035 * Math.sin((t - 3.1) * Math.PI * 2) * L.prog(t, 3.1, 3.4);
            const vis = t <= 7.2;
            ball.pos.style.opacity = vis ? 1 : 0;
            L.applyBall(ball, bs);
            trail.forEach(({ g, k }) => {
              const gs = L.ballState(path, t - k * 0.04, R, { stretch: 1.25 });
              const speed = Math.hypot(gs.vx, gs.vy);
              g.pos.style.opacity = vis ? (L.clamp(speed / 1500) * (0.6 - k * 0.13)).toFixed(3) : 0;
              L.applyBall(g, gs);
            });
            burst(t, 6.45, restX, m[5].top, 1.0);

            const flash = t > 6.45 ? Math.exp(-(t - 6.45) * 3) : 0;
            glow.style.opacity = (0.35 + 0.5 * flash).toFixed(3);
            glow.style.transform = `translate(${(bs.x - 550).toFixed(1)}px, ${(bs.y - 520).toFixed(1)}px) scale(0.6)`;

            grid(t, waves, 1);
            ruler(t);
          }

          const tl = gsap.timeline({ paused: true });
          const clock = { t: 0 };
          tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
          render(0);
          window.__timelines["main"] = tl;
        }

        document.fonts.load("900 100px Anybody");
        document.fonts.load("500 26px 'JetBrains Mono'");
        document.fonts.load("italic 420 76px Fraunces");
        document.fonts.ready.then(build);
      })();
    </script>
  </body>
