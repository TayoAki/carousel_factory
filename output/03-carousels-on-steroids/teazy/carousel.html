:root { --bg:#0b0706; --panel:#140d0b; --line:#2a1c17; --ink:#f6e7d2; --mute:#a08a7a; --hot:#ff6a13; --hot2:#ffb347; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.3 EBMono, ui-monospace, Menlo, monospace; overflow: hidden; }
button { white-space: nowrap; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; cursor: pointer; }
button:hover { border-color: #4a3128; }
button.on { background: #2a1610; border-color: var(--hot); color: #fff; }
button.hot { background: linear-gradient(180deg, #ff7a22, #d9420c); border-color: #ff8a3a; color: #1a0503; font-weight: 700; }
#bar { height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--line); background: #0e0908; }
.brand { display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; }
.brand b { font-family: EBWide, sans-serif; font-size: 14px; letter-spacing: .02em; }
.brand .sep { color: var(--mute); }
.brand .muted { color: var(--mute); margin-left: 6px; overflow: hidden; text-overflow: ellipsis; }
.flame { width: 10px; height: 14px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: radial-gradient(circle at 50% 70%, #fff3c0, #ffb347 35%, #ff5a10 70%); box-shadow: 0 0 12px #ff6a13; }
nav { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
.seg { display: flex; } .seg button { border-radius: 0; margin-left: -1px; } .seg button:first-child { border-radius: 8px 0 0 8px; } .seg button:last-child { border-radius: 0 8px 8px 0; }
.nums button { padding: 7px 9px; }
#scrub { width: 150px; accent-color: var(--hot); } #time { width: 48px; color: var(--mute); text-align: right; }
#stage { position: absolute; top: 56px; bottom: 34px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; overflow: auto; }
#wrap { position: relative; display: flex; align-items: center; justify-content: center; }
#view { display: block; background: #000; border-radius: 6px; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px #2a1c17; touch-action: none; }
.arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 64px; font-size: 32px; line-height: 1; padding: 0; background: rgba(20,12,10,.7); backdrop-filter: blur(6px); z-index: 2; }
#prev { left: -60px; } #next { right: -60px; }
#strip-labels { display: flex; } #strip-labels button { flex: 1; border: 0; background: none; color: var(--mute); padding: 4px 0; border-top: 2px solid var(--line); border-radius: 0; text-align: left; padding-left: 4px; }
#strip-labels button:hover { color: var(--ink); border-top-color: var(--hot); } #strip-labels i { font-style: normal; color: var(--hot2); margin-right: 6px; }
#slide-name { color: var(--mute); letter-spacing: .12em; text-transform: uppercase; font-size: 12px; }
#hint { position: absolute; bottom: 0; left: 0; right: 0; height: 34px; display: flex; align-items: center; justify-content: center; color: var(--mute); border-top: 1px solid var(--line); font-size: 12px; white-space: nowrap; overflow: hidden; }
#hint b { color: var(--ink); font-weight: 700; }
body[data-mode="strip"] .arrow, body[data-mode="strip"] #slide-name { display: none; }
body[data-mode="single"] #strip-labels { display: none; }
body[data-mode="strip"] #stage { justify-content: safe center; align-items: safe center; }
body.clean #bar, body.clean #hint, body.clean .arrow, body.clean #slide-name, body.clean #strip-labels { display: none !important; }
body.clean #stage { top: 0; bottom: 0; background: #000; }
body.clean #view { border-radius: 0; box-shadow: none; }
body.clean.nocursor, body.clean.nocursor * { cursor: none !important; }
#rec { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: #1a0b08; border: 1px solid var(--hot); color: #ffd2b0; padding: 8px 14px; border-radius: 99px; z-index: 9; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); color: var(--hot2); font-size: 14px; letter-spacing: .2em; text-transform: uppercase; z-index: 10; }
body.ready #loading { display: none; }
@media (max-width: 1660px) { .brand .muted { display: none; } }
@media (max-width: 1240px) { #export-all, #big { display: none; } #scrub { width: 90px; } }
@media (max-width: 860px) { #bar { height: auto; flex-wrap: wrap; padding: 8px 16px; } nav { flex-wrap: wrap; } #stage { top: 104px; } #prev { left: 4px; } #next { right: 4px; } }

// ================================================================== SLIDES — "Pick Your Social"
// One can of Teazy travels across a Southern golden-hour evening. At the end of every loop each
// slide's can whips into the next slide (whip / arrive), so the strip reads as one journey.

// ---------------------------------------------------------------- shared timing helpers
const WHIP0 = 7.3, WHIP1 = 7.9;
const POSE = [
  { x: 540, y: FLOOR, s: 0.84 }, { x: 540, y: FLOOR, s: 1.0 }, { x: 540, y: FLOOR, s: 0.92 },
  { x: 380, y: FLOOR, s: 0.92 }, { x: 540, y: FLOOR, s: 1.22 }, { x: 290, y: FLOOR, s: 0.9 },
];
function whip(k, t) {
  const P0 = POSE[k], o = { x: P0.x, y: P0.y, s: P0.s, sq: 0, lean: 0, u: 0 };
  if (k < N - 1) {
    const P1 = POSE[k + 1], u = seg(t, WHIP0, WHIP1); o.u = u;
    if (u > 0) {
      const p = E.ioBack(u, 1.1);
      o.x = lerp(P0.x, W + P1.x, p); o.s = lerp(P0.s, P1.s, clamp(p));
      o.y = P0.y - 120 * Math.sin(PI * clamp(p));          // a little hop across the seam
      o.lean = 0.22 * Math.sin(PI * u) * (u < 0.5 ? 1 : 0.6); o.sq = -0.06 * Math.sin(PI * u);
      if (u >= 1) { const a = arrive(t); o.lean = a.lean; o.sq = a.sq; o.y = P1.y; }
    }
  }
  if (k > 0 && t < WHIP0) { const a = arrive(t); o.lean += a.lean; o.sq += a.sq; }
  return o;
}
function arrive(t) { // settle after landing from a whip (wraps over the loop start)
  const dt = wrapT(t - WHIP1);
  return dt < 1.4 ? { lean: -0.06 * kick(dt, 11, 5), sq: 0.12 * damp(dt, 22, 7) } : { lean: 0, sq: 0 };
}
const beat = (t, off = 0) => decay(frac(t - off), 6.5); // every second (8 per loop)
const hop = (t, t0, d, h) => { const u = seg(t, t0, t0 + d); return u > 0 && u < 1 ? h * 4 * u * (1 - u) : 0; };

// ---------------------------------------------------------------- labels, chrome, styles
function pill(text, size = 22) {
  const track = 2.4; SCR.font = fstr(FONT.mono, size);
  let tw = 0; for (const ch of text) tw += SCR.measureText(ch).width + track; tw -= track;
  const padL = 46, padR = 24, h = size + 28, w = tw + padL + padR;
  const c = mk(w + 8, h + 8), g = c.getContext('2d'); g.translate(4, 4);
  g.beginPath(); rrect(g, 0, 0, w, h, h / 2); g.fillStyle = 'rgba(42,16,28,0.9)'; g.fill();
  g.strokeStyle = 'rgba(255,226,170,0.95)'; g.lineWidth = 2; g.stroke();
  g.save(); g.translate(25, h / 2); g.rotate(-0.6); leafPath(g, 9); g.fillStyle = '#9cd35a'; g.fill(); g.restore();
  g.font = SCR.font; g.fillStyle = '#fff4dc'; g.textBaseline = 'middle';
  let x = padL; for (const ch of text) { g.fillText(ch, x, h / 2 + 1); x += SCR.measureText(ch).width + track; }
  c.pw = w; c.ph = h; return c;
}
function drawLabel(g, t, P, t0, t1, ax, ay) {
  const sOut = seg(t, t1, t1 + 0.22);
  const s = E.outBack(seg(t, t0, t0 + 0.42), 2.6) * (1 - E.inBack(sOut, 2)); if (s <= 0.002) return;
  const x = P.x, y = P.y + 5 * Math.sin(t * OM(2) + P.x * 0.013);
  const lp = E.outC(seg(t, t0 + 0.14, t0 + 0.6)) * (1 - E.outC(sOut));
  if (lp > 0.001 && ax != null) {
    const sy = ay > y ? y + P.c.ph / 2 : y - P.c.ph / 2;
    g.save(); g.strokeStyle = 'rgba(255,244,220,0.95)'; g.lineWidth = 2.5; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x, sy); g.lineTo(lerp(x, ax, lp), lerp(sy, ay, lp)); g.stroke();
    if (lp > 0.9) {
      const q = frac(t / 0.8);
      g.fillStyle = '#ffd36a'; g.beginPath(); g.arc(ax, ay, 7, 0, TAU); g.fill();
      g.strokeStyle = `rgba(255,230,160,${(1 - q) * 0.9})`; g.lineWidth = 2; g.beginPath(); g.arc(ax, ay, 8 + 16 * q, 0, TAU); g.stroke();
    }
    g.restore();
  }
  g.save(); g.translate(x, y); g.scale(s, s); g.drawImage(P.c, -P.c.width / 2, -P.c.height / 2); g.restore();
}
const CH = {};
function buildChrome() {

  g.fillStyle = '#fff4dc';

// ---------------------------------------------------------------- the world sun (lives in slide 1, spills into 2)
function sunY(t) { return 1010 - 170 * E.outC(seg(t, 0.05, 2.3)) + 170 * E.ioS(seg(t, 6.9, 7.98)); }

// ================================================================== 04 · STILL. NOT FIZZY. — the pour

S4.mouth = (C) => { const th = C.tilt, s = C.s, cx = C.x, cy = C.y - 196 * s; return { x: cx + s * (-26 * Math.cos(th) + 196 * Math.sin(th)), y: cy + s * (-26 * Math.sin(th) - 196 * Math.cos(th)) }; };

};
S4.back = (g, t) => {

    const c = gcache(g); if (!c.grain) c.grain = g.createPattern(SPR.grain, 'repeat');

    g.save(); g.globalCompositeOperation = 'overlay'; g.globalAlpha = 0.55; g.translate(-ox, -oy); g.fillStyle = c.grain; g.fillRect(x + ox, oy, W, H); g.restore();
  }
}
const LAYERS = ['back', 'mid', 'front'];
// Render world range [vx0, vx1] at scale sc into context g (canvas origin = vx0).
function renderView(g, t, vx0, vx1, sc, opt = {}) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.setTransform(sc, 0, 0, sc, -vx0 * sc, 0);
  const k0 = clamp(Math.floor(vx0 / W), 0, N - 1), k1 = clamp(Math.floor((vx1 - 0.01) / W), 0, N - 1);
  for (let k = k0; k <= k1; k++) {
    const c0 = Math.max(vx0, k * W), c1 = Math.min(vx1, (k + 1) * W); if (c1 <= c0) continue;
    g.save(); g.beginPath(); g.rect(c0, 0, c1 - c0, H); g.clip();
    const cam = camera(k, t), cx = k * W + W / 2;
    g.translate(cx + cam.x, H / 2 + cam.y); g.rotate(cam.r); g.scale(cam.z, cam.z); g.translate(-cx, -H / 2);
    drawWorldBack(g, t, c0 - 60, c1 + 60);
    for (const layer of LAYERS) {
      for (let j = Math.max(0, k - 1); j <= Math.min(N - 1, k + 1); j++) {
        VIS.x0 = c0 - j * W; VIS.x1 = c1 - j * W;
        const fn = SL[j] && SL[j][layer]; if (!fn) continue;
        g.save(); g.translate(j * W, 0); fn(g, t); g.restore();
      }
    }
    VIS.x0 = c0; VIS.x1 = c1;
    drawWorldFront(g, t, c0 - 60, c1 + 60);
    g.restore();
    g.save(); g.beginPath(); g.rect(c0, 0, c1 - c0, H); g.clip(); post(g, k, t, opt); g.restore();
  }
}

// ================================================================== APP: preview strip, single slide, swipe, record, export
const NAMES = PROJECT.slides;
const Q = new URLSearchParams(location.search);
const $ = (s) => document.querySelector(s);
const state = {
  mode: Q.get('mode') || 'strip', slide: clamp(parseInt(Q.get('slide') || '1', 10) - 1, 0, N - 1),
  playing: Q.get('paused') !== '1', t: parseFloat(Q.get('t') || '0') % LOOP, clean: Q.get('clean') === '1',
  big: false, camX: 0, camFrom: 0, camTo: 0, camT0: -1, drag: null, exporting: false,
};
state.camX = state.camTo = state.slide * W;
let view, vg, last = 0, ready = false;

async function boot() {
  const fams = [FONT.anton, FONT.wide, FONT.blk, FONT.mono];
  try { await Promise.all(fams.map((f) => document.fonts.load(`40px ${f}`, 'AB&$1Ñ'))); } catch (e) { /* fall back */ }
  await loadAssets();
  buildBaseSprites(); projectBuild();
  for (const S of SL) if (S.build) S.build();
  if (SL.length !== N) console.error(`PROJECT.slides has ${N} names but SL has ${SL.length} slides`);
  view = $('#view'); vg = view.getContext('2d');
  buildUI(); wireUI(); layout(); ready = true;
  document.body.classList.add('ready');
  requestAnimationFrame(loop);
}

// ---------------------------------------------------------------- page chrome generated from PROJECT
function buildUI() {
  document.title = `${PROJECT.brand} · ${PROJECT.title}`;
  $('#p-brand').textContent = PROJECT.brand; $('#p-title').textContent = PROJECT.title;
  $('#p-meta').textContent = `live carousel · ${N} × ${W}×${H} · ${LOOP} s seamless loops`;
  const pad = (n) => String(n).padStart(2, '0');
  $('#nums').innerHTML = NAMES.map((_, k) => `<button data-slide="${k}">${k + 1}</button>`).join('');
  $('#strip-labels').innerHTML = NAMES.map((nm, k) => `<button data-k="${k}"><i>${pad(k + 1)}</i> ${nm}</button>`).join('');
  const sc = $('#scrub'); sc.max = String(LOOP);
}

// ---------------------------------------------------------------- layout & sizing
function layout() {
  const stage = $('#stage'), clean = state.clean;
  document.body.classList.toggle('clean', clean);
  document.body.dataset.mode = state.mode;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (state.mode === 'strip' && !clean) {
    const sw = stage.clientWidth - 2, sh = stage.clientHeight - 64;
    let cw = sw, ch = cw / (WORLD / H);
    if (state.big) { ch = Math.max(ch, sh); cw = ch * (WORLD / H); }
    else if (ch > sh) { ch = sh; cw = ch * (WORLD / H); }
    view.style.width = `${cw}px`; view.style.height = `${ch}px`;
    const bw = Math.min(Math.round(cw * dpr), Math.round(WORLD * 0.72));
    view.width = bw; view.height = Math.round(bw * (H / WORLD));
    state.sc = bw / WORLD;
    $('#strip-labels').style.width = `${cw}px`;
  } else {
    const sw = clean ? innerWidth : stage.clientWidth - 2, sh = clean ? innerHeight : stage.clientHeight - 52;
    let ch = sh, cw = ch * (W / H); if (cw > sw) { cw = sw; ch = cw * (H / W); }
    view.style.width = `${cw}px`; view.style.height = `${ch}px`;
    const bw = clean ? W : Math.min(W, Math.round(cw * dpr));
    view.width = bw; view.height = Math.round(bw * (H / W));
    state.sc = bw / W;
  }
  syncUI();
}
function syncUI() {
  document.querySelectorAll('[data-mode]').forEach((b) => b.classList.toggle('on', b.dataset.mode === state.mode));
  document.querySelectorAll('[data-slide]').forEach((b) => b.classList.toggle('on', +b.dataset.slide === state.slide));
  $('#play').textContent = state.playing ? 'Pause' : 'Play';
  $('#big').classList.toggle('on', state.big);
  $('#slide-name').textContent = `${String(state.slide + 1).padStart(2, '0')} · ${NAMES[state.slide]}`;
}

// ---------------------------------------------------------------- frame loop
function loop(now) {
  requestAnimationFrame(loop);
  if (!ready) return;
  const dt = last ? Math.min(0.1, (now - last) / 1000) : 0; last = now;
  if (state.playing && !state.drag) state.t = (state.t + dt) % LOOP;
  if (state.camT0 >= 0) {
    const p = clamp((now - state.camT0) / 520);
    state.camX = lerp(state.camFrom, state.camTo, E.outQuart(p));
    if (p >= 1) state.camT0 = -1;
  }
  draw();
  $('#time').textContent = `${state.t.toFixed(2)}s`;
  const sc = $('#scrub'); if (document.activeElement !== sc) sc.value = state.t.toFixed(3);
}
function draw() {
  if (state.mode === 'strip' && !state.clean) renderView(vg, state.t, 0, WORLD, state.sc, { grain: false });
  else renderView(vg, state.t, state.camX, state.camX + W, state.sc, { grain: state.sc > 0.6 });
}

// ---------------------------------------------------------------- navigation
function goSlide(k, animate = true) {
  k = clamp(k, 0, N - 1); state.slide = k;
  if (animate && state.mode !== 'strip') { state.camFrom = state.camX; state.camTo = k * W; state.camT0 = performance.now(); }
  else { state.camX = state.camTo = k * W; state.camT0 = -1; }
  syncUI();
}
function setMode(m) { state.mode = m; state.camX = state.camTo = state.slide * W; layout(); }
function restart() { state.t = 0; last = 0; }

function wireUI() {
  document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
  document.querySelectorAll('[data-slide]').forEach((b) => b.addEventListener('click', () => { if (state.mode === 'strip') setMode('single'); goSlide(+b.dataset.slide, false); }));
  $('#play').addEventListener('click', () => { state.playing = !state.playing; syncUI(); });
  $('#restart').addEventListener('click', restart);
  $('#big').addEventListener('click', () => { state.big = !state.big; layout(); });
  $('#clean').addEventListener('click', () => { if (state.mode === 'strip') state.mode = 'single'; state.clean = true; state.camX = state.slide * W; restart(); layout(); });
  $('#export').addEventListener('click', () => exportSlide(state.slide));
  $('#export-all').addEventListener('click', async () => { for (let k = 0; k < N; k++) await exportSlide(k); });
  $('#prev').addEventListener('click', () => goSlide(state.slide - 1));
  $('#next').addEventListener('click', () => goSlide(state.slide + 1));
  const sc = $('#scrub');
  sc.addEventListener('input', () => { state.t = parseFloat(sc.value); state.playing = false; syncUI(); });
  document.querySelectorAll('#strip-labels button').forEach((b) => b.addEventListener('click', () => { setMode('single'); goSlide(+b.dataset.k, false); }));
  window.addEventListener('resize', layout);
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' && e.key !== 'Escape') return;
    if (e.key === 'ArrowRight') { if (state.mode === 'strip' && !state.clean) setMode('single'); goSlide(state.slide + 1, !state.clean); }
    else if (e.key === 'ArrowLeft') { if (state.mode === 'strip' && !state.clean) setMode('single'); goSlide(state.slide - 1, !state.clean); }
    else if (e.key >= '1' && e.key <= '6') { if (state.mode === 'strip' && !state.clean) setMode('single'); goSlide(+e.key - 1, false); }
    else if (e.key === ' ') { state.playing = !state.playing; syncUI(); e.preventDefault(); }
    else if (e.key === 'r' || e.key === 'R') restart();
    else if (e.key === 's' || e.key === 'S') { state.clean = false; setMode('strip'); }
    else if (e.key === 'f' || e.key === 'F') { state.clean = !state.clean; if (state.clean && state.mode === 'strip') state.mode = 'single'; restart(); layout(); }
    else if (e.key === 'Escape' && state.clean) { state.clean = false; layout(); }
    else if (e.key === 'e' || e.key === 'E') exportSlide(state.slide);
  });
  // drag to swipe between slides (single view)
  view.addEventListener('pointerdown', (e) => {
    if (state.mode === 'strip' && !state.clean) return;
    state.drag = { x: e.clientX, cam: state.camX, t0: performance.now() }; state.camT0 = -1; view.setPointerCapture(e.pointerId);
  });
  view.addEventListener('pointermove', (e) => {
    if (!state.drag) return;
    const k = W / view.getBoundingClientRect().width;
    state.camX = clamp(state.drag.cam - (e.clientX - state.drag.x) * k, -120, (N - 1) * W + 120);
  });
  const end = (e) => {
    if (!state.drag) return;
    const moved = state.camX - state.drag.cam, fast = Math.abs(moved) > 60 && performance.now() - state.drag.t0 < 300;
    let k = Math.round(state.camX / W); if (fast) k = state.slide + Math.sign(moved);
    state.drag = null; goSlide(k);
  };
  view.addEventListener('pointerup', end); view.addEventListener('pointercancel', end);
  let hideT = 0;
  window.addEventListener('mousemove', () => { document.body.classList.remove('nocursor'); clearTimeout(hideT); hideT = setTimeout(() => document.body.classList.add('nocursor'), 1600); });
}

// ---------------------------------------------------------------- export one exact loop (MediaRecorder, native 1080×1350)
function exportSlide(k) {
  if (state.exporting || !window.MediaRecorder) { if (!window.MediaRecorder) alertBox('This browser cannot record canvas video. Use Chrome, or screen-record Record mode.'); return Promise.resolve(); }
  return new Promise((resolve) => {
    state.exporting = true;
    const c = mk(W, H); c.style.cssText = 'position:fixed;left:-9999px;top:0'; document.body.appendChild(c);
    const g = c.getContext('2d');
    const types = ['video/mp4;codecs=avc1.640028', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
    const mime = types.find((m) => MediaRecorder.isTypeSupported(m)) || '';
    const ext = mime.includes('mp4') ? 'mp4' : 'webm';
    const stream = c.captureStream(60), rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 18e6 });
    const chunks = []; rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    const badge = $('#rec'); badge.hidden = false;
    renderView(g, 0, k * W, (k + 1) * W, 1, { grain: true });
    let t0 = 0;
    rec.onstop = () => {
      const blob = new Blob(chunks, { type: mime || 'video/webm' }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `${(PROJECT.brand + '-' + PROJECT.title).toLowerCase().replace(/[^a-z0-9]+/g, '-')}-${String(k + 1).padStart(2, '0')}.${ext}`; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); c.remove(); }, 4000);
      badge.hidden = true; state.exporting = false; resolve();
    };
    rec.start();
    const step = (now) => {
      if (!t0) t0 = now;
      const t = (now - t0) / 1000;
      if (t >= LOOP) { renderView(g, LOOP - 0.0001, k * W, (k + 1) * W, 1, { grain: true }); setTimeout(() => rec.stop(), 60); return; }
      renderView(g, t, k * W, (k + 1) * W, 1, { grain: true });
      badge.textContent = `● Recording slide ${k + 1} — ${t.toFixed(1)} / ${LOOP}s`;
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
function alertBox(msg) { const b = $('#rec'); b.hidden = false; b.textContent = msg; setTimeout(() => (b.hidden = true), 4200); }

// ---------------------------------------------------------------- automation hooks (frame-exact rendering for headless capture)
const RC = mk(W, H), RG_ = RC.getContext('2d');
window.EB = {
  W, H, N, LOOP, ready: () => ready,
  frame(k, t, type = 'image/jpeg', q = 0.94) { renderView(RG_, wrapT(t), k * W, (k + 1) * W, 1, { grain: true }); return RC.toDataURL(type, q); },
  bench(n = 30, strip = true, sc = 0.4) { const c = mk(strip ? WORLD * sc : W * sc * 2.5, H * sc * (strip ? 1 : 2.5)), g = c.getContext('2d'); const t0 = performance.now(); for (let i = 0; i < n; i++) strip ? renderView(g, i * 0.27, 0, WORLD, sc, {}) : renderView(g, i * 0.27, 2 * W, 3 * W, 1, { grain: true }); g.getImageData(0, 0, 1, 1); return (performance.now() - t0) / n; },
  strip(t, scale = 0.25) { const c = mk(WORLD * scale, H * scale), g = c.getContext('2d'); renderView(g, wrapT(t), 0, WORLD, scale, {}); return c.toDataURL('image/jpeg', 0.9); },
};
boot();

})();
</script>
